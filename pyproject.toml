[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeos"
version = "2.0.0"
description = "lifeOS Daily — State of the Art Routine, Momentum & Journal Tracker"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "textual>=0.82.0",
    "rich>=13.0.0",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
